<!doctype html>
<html>
    <head>
        <title>Spectrum Dev</title>
        <script src="/jsspeccy/jsspeccy.js"></script>
        <style>
            body {
                display: flex;
                height: 100vh;
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #333;
            }

            #jsspeccy {
                margin: auto;
            }

            #download {
                position: absolute;
                top:0;
                right: 0;
                color: #fff;
                font-size: 20px;
                text-decoration: none;
            }

            #download:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div id="jsspeccy"></div>
        <a id="download" href="/program.tap" target="_blank">Download TAP</a>

        <script>
            const machine = ['48', '128', '5'].includes(envMachine) ? envMachine : '48';
            const autoLoadTapes = [0, 1].includes(envAutoLoadTapes) ? envAutoLoadTapes : 1;
            const tapeAutoLoadMode = ['default', 'usr0'].includes(envTapeAutoLoadMode) ? envTapeAutoLoadMode : 'default';
            const keyboardEnabled = [0, 1].includes(envKeyboardEnabled) ? envKeyboardEnabled : 1;
            const uiEnabled = [0, 1].includes(envUiEnabled) ? envUiEnabled : 1;
            const tapeTrapsEnabled = [0, 1].includes(envTapeTrapsEnabled) ? envTapeTrapsEnabled : 1;

            let previous = '';

            window.addEventListener('load', (event) => {
                const width = Math.floor(window.innerWidth / 320),
                    height = Math.floor((window.innerHeight - (25 + 30)) / 240),
                    emu = JSSpeccy(document.getElementById('jsspeccy'),
                    {
                        machine: machine,
                        autoStart: true,
                        zoom: (width > height) ? height : width,
                        sandbox: false,
                        autoLoadTapes: (autoLoadTapes === 1),
                        tapeAutoLoadMode: tapeAutoLoadMode,
                        keyboardEnabled: (keyboardEnabled === 1),
                        uiEnabled: (uiEnabled === 1),
                        tapeTrapsEnabled: (tapeTrapsEnabled === 1),
                    });

                setInterval(() => {
                    const xhr = new XMLHttpRequest();

                    xhr.responseType = 'text';
                    xhr.onload = function () {
                        if (xhr.status === 200 && xhr.responseText !== previous) {
                            previous = xhr.responseText;

                            emu.openUrl( 'http://localhost/program.tap' );
                        }
                    }
                    xhr.open('GET', 'http://localhost/update.txt');
                    xhr.send();
                }, 1000);
            });
        </script>
    </body>
</html>
